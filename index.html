
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GLOBALSTEPPER | Coming Soon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            animation: fadeIn 1.5s ease;
        }

        .logo {
            width: 100%;
            max-width: 750px;
            height: auto;
            margin: 0 auto 35px;
        }

        .est {
            font-size: 12px;
            letter-spacing: 4px;
            color: #aaa;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(30px, 6vw, 65px);
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .description {
            font-size: 16px;
            color: #bbb;
            margin-bottom: 30px;
        }

        .slogan {
            font-size: 12px;
            letter-spacing: 3px;
            margin-bottom: 40px;
        }

        .line {
            width: 200px;
            height: 2px;
            background: #333;
            margin: 0 auto 30px;
            overflow: hidden;
        }

        .line span {
            display: block;
            width: 100%;
            height: 100%;
            background: #fff;
            transform-origin: left;
            animation: loading 3s ease-in-out infinite;
        }

        .coming-soon {
            font-size: 12px;
            letter-spacing: 5px;
            color: #aaa;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes loading {
            0% { transform: scaleX(0); }
            70% { transform: scaleX(1); }
            100% { transform: scaleX(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            .container, .line span {
                animation: none;
            }
            .line span {
                transform: scaleX(1);
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <p class="est">ESTABLISHED 2022</p>

        <img
            src="media/images/globalstepper-loader.png"
            alt="GLOBALSTEPPER"
            class="logo"
        >

        <h1>THE NEXT CHAPTER IS LOADING.</h1>

        <p class="description">
            Our website is currently under construction.
            Something special is on the way.
        </p>

        <p class="slogan">
            EVERY JOURNEY BEGINS WITH ONE STEP.
        </p>

        <div class="line">
            <span></span>
        </div>

        <p class="coming-soon">
            COMING SOON
        </p>

    </main>

</body>
</html>
